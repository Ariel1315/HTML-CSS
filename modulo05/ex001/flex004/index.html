<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aula08</title>
    <style>
        .container {
            background-color: lightsalmon;

            display: flex;
            flex-flow: row wrap;

            height: 400px;
            align-items: flex-start;
        }

        .item {
            background-color: lightblue;
            border: 2px solid navy;
            padding: 20px;
            font-size: 1.5rem;
            text-align: center;
        }

        #i1 { align-self: center; }
        #i2 { align-self: stretch; }
        #i4 { align-self: flex-end; }


    </style>
</head>
<body>

    <main>
        <div class="container">
            <div class="item" id="i1">A</div>
            <div class="item" id="i2">B</div>
            <div class="item" id="i3">C</div>
            <div class="item" id="i4">D</div>
            <div class="item" id="i5">E</div>
            <div class="item" id="i6">F</div>
            <div class="item" id="i7">G</div>
        </div>
    </main>
    
</body>
</html>
