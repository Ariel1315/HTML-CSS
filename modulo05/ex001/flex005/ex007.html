<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible Box</title>
    <style>
        div.container {
            background-color: #db7272;           
            display: flex;
            flex-flow: row wrap;

        }

        div.item {
            padding: 10px;
            text-align: center;
            background-color: aqua;
            border: 1px solid black;
            flex-basis: 150px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="item">Item 1</div>
        <div class="item">Exemplo de Item 2 grandão</div>
        <div class="item">Exemplo de Item 3 grandão mesmo, quase não cabe</div>
        <div class="item">Exemplo de Item 4</div>
        <div class="item">Exemplo de Item 5</div>
    </div>

</body>
</html>
