<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible Box</title>
    <style>
        div.container {
            background-color: #db7272;  
            height: 400px;          
            display: flex;
            flex-direction: row;
            flex-wrap: wrap;
            align-content: space-between;
        }

        div.item {
            padding: 10px;
            text-align: center;
            background-color: aqua;
            border: 1px solid black;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="item">Exemplo de Item 1</div>
        <div class="item">Exemplo de Item 2</div>
        <div class="item">Exemplo de Item 3</div>
        <div class="item">Exemplo de Item 4</div>
        <div class="item">Exemplo de Item 5</div>
    </div>

</body>
</html>
