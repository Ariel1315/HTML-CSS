<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro na BP</title>
    <link rel="stylesheet" href="cadastros.css">
</head>
<body>

    <header>
        <picture class="cabeca"><img src="imagens/logo_menor.png" alt=""></picture>
        <h3>Com açucar e afeto, fiz seu doce predileto!</h3>
        <nav>
            <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="produtos.html">Produtos</a></li>
                    <li><a href="cadastro.html">Cadastro</a></li>

            </ul>
        </nav>
    </header>

    <main>
        <section class="container">
            <div id="texto">
                <h2>Cadastre-se</h2>
                <form action="#" method="post">

                    <div class="input-group">
                        <label for="nome">Nome:</label>
                        <input type="text" id="nome" name="nome" required>
                    </div>

                    <div class="input-group">
                        <label for="email">Email:</label>
                        <input type="email" id="email" name="email" required>
                    </div>

                    <div class="input-group">
                        <label for="senha">Senha:</label>
                        <input type="password" id="senha" name="senha" required>
                    </div>

                    <div class="input-group">
                        <label for="confirmar_senha">Confirmar Senha:</label>
                        <input type="password" id="confirmar_senha" name="confirmar_senha" required>
                    </div>

                    <input type="submit" value="Cadastrar" class="btn-cadastrar"> 
                </form>
            </div> 
            <picture>
                <source media="(max-width: 768px)" srcset="imagens/logo_menor.png" type="image/png">
                <img src="imagens/logo_menor.png" alt="Logo Brownie no Palito">
            </picture>
        </section>

    </main>

        <footer>
            <p>
                &copy; Brownie no Palito - 2026<br>
                CNPJ - 59.145.434/0001-22 <br>
                Contato: +55 85 98606 - 4603
            </p>
        </footer>
    
</body>
</html>
